# Accepted SkillSpector findings — benchmark-model-preset
#
# The skill ships reference snapshots (benchmark tables, fetched pages) and
# the scripts that refresh them. The scanner reads those artifacts as
# untrusted input, which is the point of the checks, not a defect.
version: 2
rules:
  - id: "AE1"
    path: "*"
    message: "*"
    reason: "Coverage warning: the skill's reference snapshots and analysis scripts exceed the scanner's per-file analysis limits, so they are reported as partially analyzed. The data is public benchmark data, not instructions."
  - id: "AE5"
    path: "*"
    message: "*"
    reason: "Same cause as AE1 — an instruction-capable artifact (a large analysis script) that exceeds whole-file semantic analysis limits."
  - id: "SC2"
    path: "*"
    message: "*curl*"
    reason: "The refresh scripts fetch public benchmark data (models.dev, SWE-rebench, the arena leaderboard) into scripts/out/. They download text, they do not execute it."
  - id: "TM1"
    path: "scripts/probe-heads.py"
    message: "*Remove //*"
    reason: "Docstring of a helper that strips // and /* */ comments from source before analysis; the text is a description, not a command."
  - id: "AE4"
    path: "*"
    message: "*"
    reason: "Mixed-script match inside fetched benchmark text with unicode normalization; the content is public data, not instructions."
  - id: "LP3"
    path: "*"
    message: "*"
    reason: "The skill declares no tool scope, which is correct for a skill that only reads its own snapshot files."
  - id: "E1"
    path: "*"
    message: "*"
    reason: "HTTPS requests to public benchmark APIs, with no secret material in the request."
