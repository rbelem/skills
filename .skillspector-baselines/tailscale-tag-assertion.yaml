# Accepted SkillSpector findings — tailscale-tag-assertion
#
# "silently log" comes from the skill's recovery notes (a node that logs
# itself out when the tag assertion is rejected). The `rm -f` is a temp-key
# cleanup step in the skill's own test recipe.
version: 2
rules:
  - id: "P3"
    path: "SKILL.md"
    message: "*silently log*"
    reason: "Phrase from the recovery notes about a node logging itself out; no credential or log exfiltration is described."
  - id: "TM1"
    path: "SKILL.md"
    message: "*rm -f*"
    reason: "Cleanup of a temporary Tailscale state file created by the skill's own test recipe."
