# Accepted SkillSpector findings — update-flake-workflow
#
# The skill bumps nix flake versions. It therefore names `nix store delete`
# (stale derivation garbage collection) and the `curl | sh` install form
# that nix itself documents. Both are the documented procedure, not an
# instruction to run unreviewed remote code.
version: 2
rules:
  - id: "TM1"
    path: "SKILL.md"
    message: "*delete*"
    reason: "Documented `nix store delete` of a stale derivation during a version bump — part of the nix upgrade procedure."
  - id: "SC2"
    path: "SKILL.md"
    message: "*curl*"
    reason: "The install snippet is the `curl | sh` form nix publishes for its own installer; the skill documents it, it does not fetch code from an arbitrary host."
  - id: "P9"
    path: "SKILL.md"
    message: "*"
    reason: "Whitespace-padding match inside an aligned output table; no hidden instruction."
